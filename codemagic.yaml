workflows:
  android-workflow:
    name: Student Wallet AI Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Check project
        script: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
      - name: Generate Android project
        script: |
          set -e
          flutter create . --platforms=android
      - name: Get packages
        script: |
          set -e
          flutter pub get
      - name: Analyze
        script: |
          set -e
          flutter analyze
      - name: Run tests
        script: |
          set -e
          flutter test
      - name: Build release APK
        script: |
          set -e
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
